# Every change: the typecheck, the unit tier (with its coverage floor), then
# the slow tier: real mail servers in Docker, and the package tests.
name: ci
on:
  push:
  pull_request:
  # The release workflow runs these first.
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A known high-severity problem in anything the server ships with stops
      # the change here, and so any release (REL-08).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npx vitest run --coverage

  slow:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Dovecot in containers (Testcontainers); the runner has Docker.
      - run: npx vitest run --config vitest.protocol.config.ts
