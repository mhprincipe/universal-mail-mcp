# A release: tag vX.Y.Z (add "-security" to the tag message's first line to
# mark a security release). Everything is tested first; then the server image
# is built, pushed, signed and pinned by digest; setup's files and the update
# feed are published. Nothing here touches anyone's installation: people
# update with  node setup.js  → 2 Update, which checks and can roll back.
#
# Needs, in the repository's settings:
#   vars.GCP_WORKLOAD_IDENTITY_PROVIDER  Workload Identity Federation provider
#   vars.GCP_RELEASE_SERVICE_ACCOUNT     may push to the release repository
#   vars.UPDATE_FEED_URL                 where latest.json is served (GitHub Pages)
name: release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  pages: write

env:
  REPOSITORY: us-docker.pkg.dev/universal-mail/release/server

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e "if (require('./package.json').version !== process.argv[1]) { console.error('package.json version differs from the tag'); process.exit(1) }" "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME" | grep -qi security; then echo "security=true" >> "$GITHUB_OUTPUT"; else echo "security=false" >> "$GITHUB_OUTPUT"; fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - id: image
        run: |
          docker build --build-arg UPDATE_FEED_URL="${{ vars.UPDATE_FEED_URL }}" -t "$REPOSITORY:${{ steps.version.outputs.version }}" .
          docker push "$REPOSITORY:${{ steps.version.outputs.version }}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$REPOSITORY:${{ steps.version.outputs.version }}" | cut -d@ -f2)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Keyless signing: anyone can verify the image came from this workflow.
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "$REPOSITORY@${{ steps.image.outputs.digest }}"

      - name: Setup's files, pinned to this image
        run: |
          npm ci
          npm run build
          mkdir -p publish/site
          node scripts/release-files.mjs publish "${{ steps.version.outputs.version }}" "${{ steps.image.outputs.digest }}" "${{ steps.version.outputs.security }}" "${{ vars.UPDATE_FEED_URL }}"
          mv publish/latest.json publish/site/latest.json
          cp setup.js README.md publish/
          mkdir -p publish/dist && cp -r dist/src publish/dist/src

      # "Open in Cloud Shell" clones the release branch: built, pinned, ready.
      - name: Publish the release branch
        run: |
          cd publish
          git init -q && git checkout -q -b release
          git add setup.js release.json README.md dist
          git -c user.name="release" -c user.email="release@users.noreply.github.com" commit -q -m "Release ${{ steps.version.outputs.version }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" release

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/site
      - uses: actions/deploy-pages@v4
